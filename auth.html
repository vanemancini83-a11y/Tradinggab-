<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0F2B22" />

  <title>TradingGab — Connexion</title>

  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <link rel="icon" href="icons/icon-192.png" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="styles.css" />
</head>
<body class="auth-body">

  <main class="auth-main">

    <div class="auth-brand">
      <span class="brand-mark" aria-hidden="true">◆</span>
      <span class="brand-name">TradingGab</span>
    </div>

    <div class="auth-card">

      <nav class="auth-tabs" aria-label="Connexion ou inscription">
        <button class="auth-tab is-active" data-mode="connexion">Connexion</button>
        <button class="auth-tab" data-mode="inscription">Créer un compte</button>
      </nav>

      <p class="auth-subtitle" id="auth-subtitle">Content de te revoir.</p>

      <form id="auth-form" class="auth-form">
        <label class="auth-label" for="phone">Numéro de téléphone</label>
        <input
          class="auth-input"
          type="tel"
          id="phone"
          name="phone"
          placeholder="+241 XX XX XX XX"
          autocomplete="tel"
          required
        />

        <label class="auth-label" for="password">Mot de passe</label>
        <input
          class="auth-input"
          type="password"
          id="password"
          name="password"
          placeholder="••••••••"
          autocomplete="current-password"
          minlength="6"
          required
        />

        <p class="auth-hint" id="auth-hint">Au moins 6 caractères.</p>

        <div class="auth-error" id="auth-error" role="alert"></div>

        <button type="submit" class="auth-submit" id="auth-submit">Se connecter</button>
      </form>

    </div>

    <p class="auth-footnote">
      Zone CEMAC · BVMAC, forex, matières premières
    </p>

  </main>

  <script src="auth.js"></script>
</body>
</html>
